name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: uv sync --extra dev --extra gui
      - run: uv run ruff check .
      - run: uv run python -m compileall -q src
      - run: uv run pytest
      - run: uv build
      - run: uv run soarm101 info
      - run: uv run soarm101-setup --help
      - run: uv run soarm101 gui --help
      - run: QT_QPA_PLATFORM=offscreen uv run soarm101-gui --simulation --smoke-test
      - run: uv run soarm101 sim-demo
