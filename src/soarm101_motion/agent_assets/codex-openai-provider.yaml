id: soarm101-codex-openai-api-key
display_name: SO-ARM101 Codex OpenAI API Key
description: OpenAI API-key access for Codex CLI in the SO-ARM101 OpenShell sandbox
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: OpenAI API key
    env_vars:
      - OPENAI_API_KEY
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials:
    - api_key

endpoints:
  - host: api.openai.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/local/bin/codex
  - /opt/codex-install/packages/standalone/**/bin/codex
  - /opt/codex-install/packages/standalone/**/codex
