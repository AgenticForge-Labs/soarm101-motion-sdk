[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soarm101-motion-sdk"
version = "0.1.0.dev0"
description = "High-level Python motion SDK for the SO-ARM101, powered by LeRobot."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "AgenticForge Labs" }]
dependencies = []

[project.optional-dependencies]
lerobot = ["lerobot>=0.6,<0.7"]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
soarm101 = "soarm101_motion.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soarm101_motion"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["soarm101_motion"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "--cov=soarm101_motion --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
