id: agenticforge-codex-api
display_name: OpenAI API for Codex
description: API-key backed OpenAI access for Codex CLI
category: agent
inference_capable: true
credentials:
  - name: api_key
    description: OpenAI API key
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: api.openai.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/bin/codex
  - /usr/local/lib/node_modules/@openai/**
