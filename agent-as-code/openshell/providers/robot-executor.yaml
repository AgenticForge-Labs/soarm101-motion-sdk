id: agenticforge-robot-executor
display_name: AgenticForge robot executor
description: Narrow authenticated access to the host-side SO-ARM101 executor
category: other
credentials:
  - name: executor_token
    description: Random bearer token generated locally by agent-as-code/install.sh
    env_vars: [ROBOT_EXECUTOR_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [executor_token]
endpoints:
  - host: host.openshell.internal
    port: 8765
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: GET, path: /v1/health }
      - allow: { method: GET, path: /v1/state }
      - allow: { method: GET, path: /v1/diagnose }
      - allow: { method: POST, path: /v1/observe }
      - allow: { method: POST, path: /v1/jog }
      - allow: { method: POST, path: /v1/gripper }
binaries:
  - /usr/bin/python3
  - /usr/bin/python3.*
  - /usr/local/bin/python3
  - /usr/local/bin/python3.*
  - /opt/hermes/.venv/bin/python
  - /opt/hermes/.venv/bin/python*
