id: agenticforge-hermes-openrouter
display_name: OpenRouter for Hermes
description: OpenRouter inference access limited to the Hermes Python runtime
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: OpenRouter API key
    env_vars: [OPENROUTER_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: openrouter.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /opt/hermes/.venv/bin/hermes
  - /opt/hermes/.venv/bin/python
  - /opt/hermes/.venv/bin/python*
